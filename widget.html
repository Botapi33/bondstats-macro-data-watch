<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#080b09;color:#edf2ee;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{border:1px solid #203027;background:#0a0e0b}.h{padding:17px 18px;border-bottom:1px solid #1c2720;display:flex;justify-content:space-between;gap:12px}.h b{font-size:13px}.h span{font:600 9px ui-monospace,SFMono-Regular,Menlo,monospace;color:#6be394;letter-spacing:.1em;text-transform:uppercase}.t{display:grid;grid-template-columns:repeat(4,1fr)}a{color:inherit;text-decoration:none;padding:16px 18px;border-right:1px solid #1c2720}a:last-child{border-right:0}.n{font-size:10px;color:#89958e}.v{font:600 21px ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:5px}.d{font-size:10px;color:#6be394;margin-top:3px}@media(max-width:600px){.t{grid-template-columns:1fr 1fr}a{border-bottom:1px solid #1c2720}.t a:nth-child(2){border-right:0}.t a:nth-child(3),.t a:nth-child(4){border-bottom:0}}</style></head><body><div class="w"><div class="h"><b>Macro Data Watch</b><span>Official data</span></div><div class="t" id="t"></div></div><script>
const fmt=i=>i.unit==="k"?((i.value>0?"+":"")+Math.round(i.value)+"k"):(Number(i.value).toFixed(1)+"%");
fetch("data/macro.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{let ids=["US_CPI","US_PAYROLLS","US_PCE","EA_HICP"],x=ids.map(id=>d.indicators.find(i=>i.id===id)).filter(Boolean);document.getElementById("t").innerHTML=x.map(i=>`<a href="${i.sourceUrl}" target="_blank" rel="noopener"><div class="n">${i.region==="United States"?"US":"EA"} · ${i.name}</div><div class="v">${fmt(i)}</div><div class="d">${i.period}</div></a>`).join("")})</script></body></html>
