<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#080b09;color:#eaf1ec;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;max-width:850px;margin:35px auto;padding:18px}.top{border-bottom:1px solid #243028;padding-bottom:18px}.row{display:grid;grid-template-columns:120px 120px 1fr;padding:14px 0;border-bottom:1px solid #1c2720}.ok{color:#6be394}.bad{color:#e08b8b}.muted{color:#849087}@media(max-width:600px){.row{grid-template-columns:90px 1fr}.time{display:none}}</style></head><body><div class="top"><div class="muted">BONDSTATS / MACRO SOURCE HEALTH</div><h1>Macro Data Watch</h1><div id="stamp"></div></div><div id="rows"></div><script>
fetch("data/macro.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{document.getElementById("stamp").textContent="Last checked: "+(d.meta.lastChecked||"not yet run on GitHub");document.getElementById("rows").innerHTML=Object.entries(d.sourceHealth).map(([k,v])=>`<div class="row"><b>${k}</b><span class="${v.state==="degraded"?"bad":"ok"}">${v.state.toUpperCase()}</span><span class="time muted">${v.lastChecked||"seed"}</span></div>`).join("")})</script></body></html>
