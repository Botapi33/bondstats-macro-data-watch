name: Update Macro Data Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: macro-data-watch-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh official macro data
        run: python scripts/update_macro.py

      - name: Run deterministic tests
        run: python tests/test_macro.py

      - name: Commit refreshed feed
        run: |
          if git diff --quiet -- data/macro.json; then
            echo "Data already current."
            exit 0
          fi

          git config user.name "bondstats-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/macro.json
          git commit -m "Update macro data"
          git push
